services:
  - type: web
    name: zonepulse-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zonepulse-db
          property: connectionString

  - type: web
    name: Ride_Demand_Project
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zonepulse-db
          property: connectionString

databases:
  - name: zonepulse-db
    databaseName: zonepulse
    user: zonepulse
    plan: free
    region: oregon
