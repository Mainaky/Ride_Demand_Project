services:
  - type: web
    name: zonepulse-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zonepulse-db
          property: connectionString

  - type: web
    name: Ride_Demand_Project
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      # Free Render web services cannot receive private network requests.
      - key: API_BASE_URL
        value: https://zonepulse-api-mmyw.onrender.com

databases:
  - name: zonepulse-db
    databaseName: zonepulse
    user: zonepulse
    plan: free
    region: oregon
