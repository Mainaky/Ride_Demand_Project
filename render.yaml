services:
  # ── Backend: FastAPI ML & Auth Service ─────────────────────────────────────
  - type: web
    name: zonepulse-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: JWT_SECRET_KEY
        generateValue: true

  # ── Frontend: Streamlit Interactive UI ──────────────────────────────────────
  - type: web
    name: zonepulse-dashboard
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: API_BASE_URL
        value: https://zonepulse-api.onrender.com
